<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css"
    rel="stylesheet"
    type="text/css"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Donald's Donuts</title>
</head>
<body>
  <section
    id="menu"
    class="py-16 bg-cover bg-center relative"
    style="
      background-image: url('../../images/bckgrnd_imgs/menu_bckgrnd_img.jpg');
    "
  >
    <div
      class="text-center text-white p-4 bg-black bg-opacity-50 rounded-lg mb-8"
    >
      <h1 class="text-5xl md:text-7xl font-bold">Our Menu</h1>
    </div>
    <div
      class="flex flex-wrap justify-center space-y-4 md:space-y-0 md:space-x-4 mt-8"
    >
      <div
        class="card w-full md:w-1/3 lg:w-1/4 bg-base-100 shadow-xl image-full transition-transform transform hover:scale-105 border-solid border-4 border-black rounded-3xl"
      >
        <figure>
          <img
            src="../../images/menu_page_imgs/donuts_menu.jpg"
            class="w-full h-full object-cover"
          />
        </figure>
        <div class="card-body flex justify-center items-center">
          <p class="card-title text-2xl md:text-3xl lg:text-4xl">Donuts</p>
        </div>
      </div>
      <div
        class="card w-full md:w-1/3 lg:w-1/4 bg-base-100 shadow-xl image-full transition-transform transform hover:scale-105 border-solid border-4 border-black rounded-3xl"
      >
        <figure>
          <img
            src="../../images/menu_page_imgs/pastries_menu.jpg"
            class="w-full h-full object-cover"
          />
        </figure>
        <div class="card-body flex justify-center items-center">
          <p class="card-title text-2xl md:text-3xl lg:text-4xl">Pastries</p>
        </div>
      </div>
      <div
        class="card w-full md:w-1/3 lg:w-1/4 bg-base-100 shadow-xl image-full transition-transform transform hover:scale-105 border-solid border-4 border-black rounded-3xl"
      >
        <figure>
          <img
            src="../../images/menu_page_imgs/breakfast_menu.jpg"
            class="w-full h-full object-cover"
          />
        </figure>
        <div class="card-body flex justify-center items-center">
          <p class="card-title text-2xl md:text-3xl lg:text-4xl">Breakfast</p>
        </div>
      </div>
    </div>
    <div
      class="flex flex-wrap justify-center space-y-4 md:space-y-0 md:space-x-4 mt-8"
    >
      <div
        class="card w-full md:w-1/3 lg:w-1/4 bg-base-100 shadow-xl image-full transition-transform transform hover:scale-105 border-solid border-4 border-black rounded-3xl"
      >
        <figure>
          <img
            src="../../images/menu_page_imgs/beverages_menu.jpg"
            class="w-full h-full object-cover"
          />
        </figure>
        <div class="card-body flex justify-center items-center">
          <p class="card-title text-2xl md:text-3xl lg:text-4xl">Kolaches</p>
        </div>
      </div>
      <div
        class="card w-full md:w-1/3 lg:w-1/4 bg-base-100 shadow-xl image-full transition-transform transform hover:scale-105 border-solid border-4 border-black rounded-3xl"
      >
        <figure>
          <img
            src="../../images/menu_page_imgs/croissant_sandwich_menu.jpg"
            class="w-full h-full object-cover"
          />
        </figure>
        <div class="card-body flex justify-center items-center">
          <p class="card-title text-2xl md:text-3xl lg:text-4xl text-center">
            Croissant Sandwiches
          </p>
        </div>
      </div>
      <div
        class="card w-full md:w-1/3 lg:w-1/4 bg-base-100 shadow-xl image-full transition-transform transform hover:scale-105 border-solid border-4 border-black rounded-3xl"
      >
        <figure>
          <img
            src="../../images/menu_page_imgs/beverages_menu.jpg"
            class="w-full h-full object-cover"
          />
        </figure>
        <div class="card-body flex justify-center items-center">
          <p class="card-title text-2xl md:text-3xl lg:text-4xl">Beverages</p>
        </div>
      </div>
    </div>
  </section>
</body>
